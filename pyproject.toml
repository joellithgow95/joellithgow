[project]
name = "joellithgow-cms"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "starlette-cms[mcp,collab-verify]>=0.4.0",
    "starlette-editor>=0.2.0",
    "starlette-chat[openai]>=0.1.0",
    "uvicorn[standard]>=0.30.0",
    "piccolo[sqlite]>=1.0.0",
    "httpx>=0.27.0",
    "python-frontmatter>=1.1.0",
    "markdown>=3.7",
    "pyyaml>=6.0",
    "starlette-cms-gateways>=0.1.0",
    "starlette-cms-feedback[mcp]>=0.1.0",
    "spotipy>=2.23",
    "astraeus-otel>=0.1.0",
    "astraeus-portal>=0.1.0",
    "mediakit[admin]>=0.2.0",
]

[tool.uv]

[tool.uv.sources]
starlette-cms = { path = "../astraeus/packages/starlette-cms", editable = true }
starlette-editor = { path = "../astraeus/packages/starlette-editor", editable = true }
starlette-chat = { path = "../astraeus/packages/starlette-chat", editable = true }
starlette-cms-gateways = { path = "../astraeus/packages/starlette-cms-gateways", editable = true }
starlette-cms-feedback = { path = "../astraeus/packages/starlette-cms-feedback", editable = true }
astraeus-otel = { path = "../astraeus/packages/astraeus-otel", editable = true }
astraeus-portal = { path = "../astraeus/packages/astraeus-portal", editable = true }
mediakit = { path = "../astraeus/packages/mediakit", editable = true }

# The legacy month and outing gateways (spotify-liked-dump, inaturalist-field-trips) are
# no longer registered: their posts became blog posts with slices (cms/migrate_to_slices.py),
# and a run would write the old documents back on the same slugs.
[project.entry-points."starlette_cms_gateways.gateways"]
spotify-likes            = "cms.gateways.spotify_likes:SpotifyLikesGateway"
inaturalist-observations = "cms.gateways.inaturalist_observations:INaturalistObservationsGateway"
